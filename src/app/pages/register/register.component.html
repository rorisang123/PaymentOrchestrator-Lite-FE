<div class="min-h-screen bg-slate-50 flex items-center justify-center">
  <div class="bg-white p-10 rounded-3xl w-full max-w-md shadow-xl border border-slate-100">
    <div class="flex justify-center mb-8">
      <div class="w-12 h-12 bg-blue-700 rounded-2xl flex items-center justify-center text-white font-bold text-3xl">P</div>
    </div>
    
    <h1 class="text-3xl font-bold text-center mb-8 text-slate-900">Create Account</h1>

    <form (ngSubmit)="onRegister()" class="space-y-6">
      <input 
        type="text" 
        [value]="credentials().username"
        (input)="credentials.set({...credentials(), username: $event.target.value})"
        placeholder="Username"
        required
        class="w-full bg-white border border-slate-300 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-600">

      <input 
        type="email" 
        [value]="credentials().email"
        (input)="credentials.set({...credentials(), email: $event.target.value})"
        placeholder="Email"
        required
        class="w-full bg-white border border-slate-300 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-600">

      <div>
  <input 
    type="password" 
    [value]="credentials().password"
    (input)="onPasswordChange($event.target.value)"
    placeholder="Password"
    required
    class="w-full bg-white border border-slate-300 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-600 text-lg">

  @if (credentials().password) {
    <div class="mt-3">
      <div class="h-2 bg-slate-200 rounded-full overflow-hidden">
        <div 
          [style.width.%]="passwordStrength() === 'strong' ? 100 : passwordStrength() === 'medium' ? 66 : 33"
          [ngClass]="{
            'bg-red-500': passwordStrength() === 'weak',
            'bg-orange-500': passwordStrength() === 'medium',
            'bg-green-500': passwordStrength() === 'strong'
          }" 
          class="h-2 transition-all duration-300">
        </div>
      </div>

      <div class="mt-4 space-y-2 text-sm">
        <div [ngClass]="credentials().password.length >= 8 ? 'text-green-600' : 'text-slate-400'">
          At least 8 characters
        </div>
        <div [ngClass]="hasNumber() ? 'text-green-600' : 'text-slate-400'">
          Contains a number
        </div>
        <div [ngClass]="hasSpecial() ? 'text-green-600' : 'text-slate-400'">
          Contains a special character
        </div>
      </div>
    </div>
  }
</div>

      <button 
        type="submit"
        [disabled]="loading()"
        class="w-full bg-blue-700 hover:bg-blue-800 disabled:bg-slate-400 py-4 rounded-2xl font-semibold text-lg text-white transition">
        {{ loading() ? 'Creating Account...' : 'Register' }}
      </button>
    </form>

    @if (error()) {
      <p class="text-red-600 text-center mt-4">{{ error() }}</p>
    }
  
    <p class="text-center text-slate-500 mt-6">
      Already have an account? 
      <a routerLink="/login" class="text-blue-600 cursor-pointer hover:underline font-medium">Login</a>
    </p>
  </div>
</div>
