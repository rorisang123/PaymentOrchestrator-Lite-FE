<div class="min-h-screen bg-zinc-950 text-white">
  <div class="max-w-5xl mx-auto p-8">
    <div class="flex justify-between items-center mb-10">
      <h1 class="text-4xl font-bold tracking-tight">Payment Orchestrator</h1>
      <button 
        (click)="loadPayments()"
        class="px-5 py-2.5 bg-zinc-800 hover:bg-zinc-700 rounded-xl flex items-center gap-2 transition">
          Refresh
      </button>
    </div>

    <div class="bg-zinc-900 rounded-3xl p-8 mb-12 border border-zinc-800">
      <h2 class="text-2xl font-semibold mb-6">New Payment</h2>
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        <div class="md:col-span-5">
          <input 
            [(ngModel)]="newPayment.customerId" 
            placeholder="Customer ID"
            class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500 text-lg">
        </div>
        <div class="md:col-span-4">
          <input 
            type="number" 
            [(ngModel)]="newPayment.amount" 
            placeholder="Amount (ZAR)"
            class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500 text-lg">
        </div>
        <div class="md:col-span-3">
          <button 
            (click)="createPayment()"
            class="w-full bg-blue-600 hover:bg-blue-500 h-full rounded-2xl font-semibold text-lg transition">
            Create
          </button>
        </div>
      </div>
    </div>

    <div class="bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800">
      <table class="w-full">
        <thead>
          <tr class="border-b border-zinc-800">
            <th class="text-left p-6 font-medium text-zinc-400">ID</th>
            <th class="text-left p-6 font-medium text-zinc-400">Customer</th>
            <th class="text-left p-6 font-medium text-zinc-400">Amount</th>
            <th class="text-left p-6 font-medium text-zinc-400">Status</th>
            <th class="text-left p-6 font-medium text-zinc-400">Date</th>
            <th></th>
          </tr>
        </thead>
        <tbody class="divide-y divide-zinc-800">
          @for(p of payments; track p.id) {
            <tr class="hover:bg-zinc-800/50 transition">
            <td class="p-6 font-mono text-sm text-zinc-400">{{ p.id.slice(0,8) }}...</td>
            <td class="p-6">{{ p.customerId }}</td>
            <td class="p-6 font-medium">R {{ p.amount | number:'1.2-2' }}</td>
            <td class="p-6">
              <span [class]="p.status === 'Confirmed' 
                ? 'bg-emerald-500/20 text-emerald-400' 
                : 'bg-amber-500/20 text-amber-400'" 
                class="px-4 py-1.5 rounded-full text-sm font-medium">
                {{ p.status }}
              </span>
            </td>
            <td class="p-6 text-sm text-zinc-400">{{ p.createdAt | date:'short' }}</td>
            <td class="p-6 text-right">
              <button *ngIf="p.status === 'Pending'"
                      (click)="confirmPayment(p.id)"
                      class="bg-emerald-600 hover:bg-emerald-500 px-6 py-2 rounded-2xl text-sm font-medium transition">
                Confirm
              </button>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
