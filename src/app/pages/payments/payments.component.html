<div class="min-h-screen bg-slate-50">
  <div class="max-w-6xl mx-auto p-8">
    <!-- Header -->
    <div class="flex justify-between items-center mb-10">
      <div class="flex items-center gap-4">
        <div class="w-11 h-11 bg-blue-700 rounded-2xl flex items-center justify-center text-white font-bold text-2xl">P</div>
        <h1 class="text-4xl font-bold text-slate-900">FlexiPay</h1>
      </div>
      
      <div class="flex items-center gap-4">
        <button (click)="loadPayments()" 
                class="px-5 py-2.5 bg-white border border-slate-300 hover:bg-slate-100 rounded-xl text-slate-700 font-medium">
          ↻ Refresh
        </button>
        
        <button (click)="logout()" 
                class="px-6 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-medium transition">
          Logout
        </button>
      </div>
    </div>

    <div class="bg-white rounded-3xl shadow p-8 mb-12 border border-slate-100">
      <h2 class="text-2xl font-semibold mb-6 text-slate-900">Create New Payment</h2>
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        <input 
          type="number" 
          [(ngModel)]="newPayment.amount" 
          placeholder="Amount (ZAR)"
          class="md:col-span-5 bg-white border border-slate-300 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-600 text-lg">

        <button 
          (click)="createPayment()" 
          class="md:col-span-3 bg-blue-700 hover:bg-blue-800 text-white font-semibold py-4 rounded-2xl transition">
          Create Payment
        </button>
      </div>
    </div>

    <div class="bg-white rounded-3xl shadow overflow-hidden border border-slate-100">
      <table class="w-full">
        <thead class="bg-slate-100">
          <tr>
            <th class="text-left p-6 font-medium text-slate-600">ID</th>
            <th class="text-left p-6 font-medium text-slate-600">Customer ID</th>
            <th class="text-left p-6 font-medium text-slate-600">Amount</th>
            <th class="text-left p-6 font-medium text-slate-600">Status</th>
            <th class="text-left p-6 font-medium text-slate-600">Created</th>
            <th class="text-center p-6">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          @for (p of payments; track p.id) {
            <tr class="hover:bg-slate-50">
              <td class="p-6 font-mono text-sm text-slate-500">{{ p.id.slice(0,8) }}...</td>
              <td class="p-6 text-slate-900">{{ p.customerId }}</td>
              <td class="p-6 font-medium text-slate-900">R {{ p.amount | number:'1.2-2' }}</td>
              <td class="p-6">
                <span [ngClass]="p.status === 'Confirmed' 
                  ? 'bg-emerald-100 text-emerald-700' 
                  : 'bg-amber-100 text-amber-700'" 
                  class="px-4 py-1 rounded-full text-sm font-medium">
                  {{ p.status }}
                </span>
              </td>
              <td class="p-6 text-sm text-slate-500">{{ p.createdAt | date:'short' }}</td>
              <td class="p-6 text-center">
                <button 
                  *ngIf="p.status === 'Pending'"
                  (click)="confirmPayment(p.id)"
                  [disabled]="confirmingId === p.id"
                  class="bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-400 px-6 py-2 rounded-2xl text-sm font-medium text-white transition">
                  {{ confirmingId === p.id ? 'Confirming...' : 'Confirm' }}
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
